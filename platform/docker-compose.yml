version: "3.9"
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ICS_DEBUG: "1"
      ICS_ALLOWED_HOSTS: "*"
      ICS_DATABASE_URL: "sqlite:////data/ics_platform.db"
    volumes:
      - backend-data:/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "4173:4173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8000/api"
    depends_on:
      - backend

volumes:
  backend-data:
